<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>XPWeb OS - Real System</title>
<style>
  :root {
    --bg-desktop: linear-gradient(180deg, #3a6ea5 0%, #24557f 100%);
    --bg-window: #ece9d8;
    --bg-content: #ffffff;
    --text-main: #000000;
    --win-border: #0831d9;
    --win-titlebar: linear-gradient(180deg, #0a57d6, #0831d9);
    --win-titletext: #ffffff;
    --taskbar-bg: linear-gradient(180deg, #3f8cf3, #1e5fbf);
    --start-btn-bg: linear-gradient(180deg, #58a83c, #2c6a1d);
    --file-item-hover: #e0ecff;
    --font-size: 14px;
  }
  [data-theme="dark"] {
    --bg-desktop: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
    --bg-window: #2d2d2d;
    --bg-content: #1e1e1e;
    --text-main: #e0e0e0;
    --win-border: #444444;
    --win-titlebar: linear-gradient(180deg, #333333, #222222);
    --win-titletext: #e0e0e0;
    --taskbar-bg: linear-gradient(180deg, #2d2d2d, #1a1a1a);
    --start-btn-bg: linear-gradient(180deg, #3a7a3a, #1d4a1d);
    --file-item-hover: #333333;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg-desktop); color: var(--text-main); font-size: var(--font-size); }
  
  #setupScreen, #loginScreen { position: fixed; inset: 0; background: #1a1a1a; z-index: 999999; display: flex; align-items: center; justify-content: center; color: #fff; flex-direction: column; }
  #setupScreen.hidden, #loginScreen.hidden { display: none; }
  .setup-box { background: #2d2d2d; border: 1px solid #444; padding: 30px; border-radius: 8px; width: 100%; max-width: 400px; text-align: center; }
  .setup-box h2 { margin-bottom: 20px; font-weight: normal; }
  .setup-box input, .setup-box select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #555; background: #1a1a1a; color: #fff; border-radius: 4px; outline: none; }
  .setup-box button { width: 100%; padding: 12px; background: #0a57d6; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
  .avatar-preview { font-size: 60px; margin-bottom: 20px; }

  #desktop { position: fixed; inset: 0; background: var(--bg-desktop); overflow: hidden; }
  
  .desktop-icon { position: absolute; width: 85px; text-align: center; color: #fff; text-shadow: 1px 1px 2px #000; padding: 8px 4px; border-radius: 4px; cursor: pointer; font-size: 12px; word-wrap: break-word; line-height: 1.2; z-index: 10; }
  .desktop-icon.selected { background: rgba(49, 106, 197, 0.7); outline: 1px dotted #fff; }
  .desktop-icon .glyph { font-size: 38px; display: block; margin-bottom: 4px; }

  #selection-box { position: absolute; border: 1px solid #fff; background: rgba(49, 106, 197, 0.3); z-index: 20; display: none; }

  .win { position: absolute; min-width: 260px; min-height: 200px; background: var(--bg-window); border: 1px solid var(--win-border); border-radius: 6px 6px 0 0; box-shadow: 3px 3px 12px rgba(0,0,0,.45); display: flex; flex-direction: column; overflow: hidden; }
  .win .titlebar { background: var(--win-titlebar); color: var(--win-titletext); padding: 6px 8px; font-size: 13px; font-weight: bold; display: flex; align-items: center; cursor: move; gap: 6px; min-height: 32px; }
  .win .titlebar .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .win .btn { width: 26px; height: 24px; border: 1px solid #fff; border-radius: 3px; background: rgba(255,255,255,0.2); color: #fff; font-size: 14px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .win .btn.close { background: #d44; }
  .win .content { flex: 1; overflow: auto; background: var(--bg-content); padding: 10px; font-size: var(--font-size); position: relative; display: flex; flex-direction: column; }
  .win.minimized { display: none; }
  .win.maximized { left: 0 !important; top: 0 !important; width: 100% !important; height: calc(100% - 48px) !important; border-radius: 0; }
  
  #taskbar { position: fixed; left: 0; right: 0; bottom: 0; height: 48px; background: var(--taskbar-bg); display: flex; align-items: center; gap: 6px; padding: 0 8px; z-index: 100000; }
  #startBtn { background: var(--start-btn-bg); color: #fff; font-weight: bold; font-style: italic; border: 1px solid #1c4b12; border-radius: 4px; padding: 0 16px; height: 36px; font-size: 15px; cursor: pointer; }
  #taskItems { display: flex; gap: 4px; flex: 1; overflow: hidden; }
  .taskItem { background: #2a6bd8; color: #fff; border: 1px solid #1443a0; padding: 6px 10px; border-radius: 3px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; cursor: pointer; }
  .taskItem.active { background: #1443a0; }
  #tray { display: flex; align-items: center; gap: 10px; color: #fff; font-size: 16px; cursor: pointer; }
  
  #startMenu { position: fixed; bottom: 48px; left: 0; width: 280px; height: 420px; background: var(--bg-window); border: 1px solid var(--win-border); display: none; flex-direction: column; z-index: 99999; }
  #startMenu.open { display: flex; }
  #startHeader { background: var(--win-titlebar); color: var(--win-titletext); padding: 12px; display: flex; gap: 10px; align-items: center; }
  #startBody { flex: 1; overflow: auto; padding: 6px; color: var(--text-main); }
  .startItem { display: flex; align-items: center; gap: 10px; padding: 10px; font-size: 14px; cursor: pointer; border-radius: 3px; }
  .startItem:active, .startItem:hover { background: #316ac5; color: #fff; }
  .startItem .g { font-size: 22px; }
  #startFooter { padding: 8px; background: var(--win-titlebar); display: flex; justify-content: flex-end; gap: 8px; }
  #startFooter button { padding: 6px 12px; font-size: 13px; border-radius: 3px; cursor: pointer; }

  .fileGrid { display: grid; grid-template-columns: repeat(auto-fill, 75px); gap: 8px; position: relative; min-height: 100px; flex: 1; overflow-y: auto; align-content: start; }
  .fileItem { text-align: center; padding: 6px 2px; border-radius: 3px; font-size: 12px; cursor: pointer; word-wrap: break-word; line-height: 1.2; }
  .fileItem:hover { background: var(--file-item-hover); }
  .fileItem.selected { background: #316ac5; color: #fff; }
  .fileItem .g { font-size: 34px; display: block; margin-bottom: 4px; }
  .pathBar { background: #f5f5f5; padding: 4px 8px; border: 1px solid #ccc; margin-bottom: 10px; font-size: 12px; border-radius: 3px; display: flex; align-items: center; justify-content: space-between; }
  .pathBar button { padding: 4px 8px; cursor: pointer; font-size: 11px; }

  .ctxMenu { position: fixed; background: var(--bg-content); border: 1px solid #999; box-shadow: 2px 2px 10px rgba(0,0,0,.5); min-width: 170px; z-index: 200000; font-size: 14px; border-radius: 2px; padding: 4px 0; color: var(--text-main); }
  .ctxMenu .item { padding: 10px 16px; display: flex; gap: 10px; cursor: pointer; }
  .ctxMenu .item:hover, .ctxMenu .item:active { background: #316ac5; color: #fff; }
  .ctxMenu .item.disabled { opacity: 0.5; pointer-events: none; }
  .ctxMenu .sep { height: 1px; background: #ddd; margin: 4px 0; }

  textarea.note { width: 100%; height: calc(100% - 50px); border: 1px solid #ccc; padding: 10px; font-size: 14px; outline: none; background: var(--bg-content); color: var(--text-main); resize: none; flex: 1; }
  
  .console { background: #000; color: #0f0; font-family: monospace; padding: 10px; flex: 1; overflow-y: auto; font-size: 13px; white-space: pre-wrap; }
  .console .line { margin-bottom: 2px; word-wrap: break-word; }
  .console-input-row { display: flex; padding: 5px; background: #000; }
  .console input { background: transparent; border: none; outline: none; color: #0f0; font-family: monospace; font-size: 13px; width: 100%; }

  .settings-layout { display: flex; height: 100%; gap: 10px; }
  .settings-sidebar { width: 150px; border-right: 1px solid #ccc; overflow-y: auto; }
  .settings-sidebar .item { padding: 8px; cursor: pointer; border-radius: 4px; font-size: 13px; }
  .settings-sidebar .item:hover { background: var(--file-item-hover); }
  .settings-sidebar .item.active { background: #316ac5; color: #fff; }
  .settings-main { flex: 1; overflow-y: auto; padding-left: 10px; }
  .settings-main h3 { margin-bottom: 12px; font-size: 16px; }
  .settings-row { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #ddd; }
  .settings-row label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 13px; }
  .settings-row select, .settings-row input[type="range"], .settings-row input[type="text"], .settings-row input[type="password"] { width: 100%; padding: 6px; border: 1px solid #888; border-radius: 3px; background: var(--bg-content); color: var(--text-main); }
  .settings-row input[type="checkbox"] { transform: scale(1.3); margin-right: 8px; }
  .settings-row .hint { font-size: 11px; opacity: .7; margin-top: 4px; }

  /* Browser */
  .browser-toolbar { display: flex; gap: 4px; padding: 4px; background: var(--bg-window); border-bottom: 1px solid #aaa; align-items: center; }
  .browser-toolbar button { padding: 4px 8px; cursor: pointer; font-size: 12px; }
  .browser-toolbar input { flex: 1; padding: 6px; border: 1px solid #888; border-radius: 3px; font-size: 12px; background: var(--bg-content); color: var(--text-main); }
  .browser-frame { flex: 1; border: none; width: 100%; background: #fff; }
  .browser-warn { padding: 20px; font-size: 13px; line-height: 1.5; }
</style>
</head>
<body>

<div id="setupScreen" class="hidden">
  <div class="setup-box">
    <h2>Установка XPWeb OS</h2>
    <div class="avatar-preview" id="avatarPreview">👤</div>
    <input type="text" id="setupName" placeholder="Имя">
    <input type="text" id="setupLogin" placeholder="Логин">
    <input type="password" id="setupPass" placeholder="Пароль">
    <select id="setupAvatar">
      <option value="👤">👤</option><option value="👨‍💻">👨‍💻</option>
      <option value="🐱">🐱</option><option value="🤖">🤖</option>
    </select>
    <button id="installBtn">Установить</button>
  </div>
</div>

<div id="loginScreen" class="hidden">
  <div class="setup-box">
    <div class="avatar-preview" id="loginAvatar">👤</div>
    <h2 id="loginName">Пользователь</h2>
    <input type="text" id="loginInput" placeholder="Логин">
    <input type="password" id="loginPass" placeholder="Пароль">
    <button id="loginBtn">Войти</button>
  </div>
</div>

<div id="desktop">
  <div id="selection-box"></div>
</div>

<div id="taskbar">
  <button id="startBtn">⊞ Пуск</button>
  <div id="taskItems"></div>
  <div id="tray">
    <span id="trayLang">RU</span>
    <span id="trayVolume">🔊</span>
    <span id="trayWifi">📶</span>
    <span id="trayTheme">☀️</span>
  </div>
</div>

<div id="startMenu">
  <div id="startHeader">
    <span id="startAvatar" style="font-size:28px;">👤</span>
    <div>
      <span id="startUserName" style="font-weight:bold;">Пользователь</span><br>
      <small>XPWeb OS</small>
    </div>
  </div>
  <div id="startBody"></div>
  <div id="startFooter">
    <button id="btnShutdown">⏻ Выключить</button>
  </div>
</div>

<script>
var USER_KEY = 'xpweb_user_v10';
var DESKTOP_FILES_KEY = 'xpweb_desktop_files_v1';
var userAccount = null;

var config = {
  theme: 'light', lang: 'ru', vol: 80, bright: 100, wifi: true,
  userName: 'Пользователь', userAvatar: '👤',
  updateAuto: true, firewall: true, batterySaver: false,
  wallpaper: 'default'
};

// ================= API ДЛЯ СВЯЗИ С КОЛОНКОЙ =================
const OS_API = {
  async ls(path) {
    try {
      const res = await fetch(`/api/ls?path=${encodeURIComponent(path)}`);
      return await res.json();
    } catch(e) { return []; }
  },
  async mkdir(path, name) {
    await fetch(`/api/create?type=dir&path=${encodeURIComponent(path + '/' + name)}`);
  },
  async touch(path, name) {
    await fetch(`/api/create?type=file&path=${encodeURIComponent(path + '/' + name)}`);
  },
  async rm(path) {
    await fetch(`/api/delete?path=${encodeURIComponent(path)}`);
  },
  async read(path) {
    try {
      const res = await fetch(`/api/read?path=${encodeURIComponent(path)}`);
      return await res.text();
    } catch(e) { return 'Ошибка чтения'; }
  },
  async write(path, content) {
    await fetch(`/api/write?path=${encodeURIComponent(path)}&content=${encodeURIComponent(content)}`);
  },
  async exec(cmd) {
    try {
      const res = await fetch(`/api/exec?cmd=${encodeURIComponent(cmd)}`);
      return await res.text();
    } catch(e) { return 'Ошибка выполнения'; }
  }
};

var winZ = 100, winIdSeq = 1;
var openWindows = {};
var selectedIcons = [];
var clipboard = null; // { path, type, source: 'fs'|'desktop' }

var SYSTEM_ICONS = [
  { id: 'sys:root', label: 'Корень', glyph: '💽', app: 'explorer', path: '/' },
  { id: 'sys:docs', label: 'Данные', glyph: '📁', app: 'explorer', path: '/data' },
  { id: 'sys:console', label: 'Терминал', glyph: '💻', app: 'console' },
  { id: 'sys:browser', label: 'Браузер', glyph: '🌐', app: 'browser' },
  { id: 'sys:settings', label: 'Настройки', glyph: '⚙️', app: 'settings' }
];

// ===== Десктопные "файлы" (виртуальные, в localStorage) =====
function getDesktopFiles() {
  try { return JSON.parse(localStorage.getItem(DESKTOP_FILES_KEY)) || []; }
  catch(e) { return []; }
}
function saveDesktopFiles(arr) {
  localStorage.setItem(DESKTOP_FILES_KEY, JSON.stringify(arr));
}

function checkAuth() {
  var saved = localStorage.getItem(USER_KEY);
  if (saved) {
    userAccount = JSON.parse(saved);
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('loginAvatar').textContent = userAccount.avatar;
    document.getElementById('loginName').textContent = userAccount.name;
    config.userName = userAccount.name;
    config.userAvatar = userAccount.avatar;
  } else {
    document.getElementById('setupScreen').classList.remove('hidden');
  }
}

document.getElementById('setupAvatar').onchange = function(e) { document.getElementById('avatarPreview').textContent = e.target.value; };

document.getElementById('installBtn').onclick = function() {
  var name = document.getElementById('setupName').value.trim();
  var login = document.getElementById('setupLogin').value.trim();
  var pass = document.getElementById('setupPass').value;
  var avatar = document.getElementById('setupAvatar').value;
  if (!name || !login || !pass) { alert('Заполните все поля!'); return; }
  var acc = { name: name, login: login, pass: pass, avatar: avatar };
  localStorage.setItem(USER_KEY, JSON.stringify(acc));
  userAccount = acc;
  config.userName = name;
  config.userAvatar = avatar;
  document.getElementById('setupScreen').classList.add('hidden');
  bootOS();
};

document.getElementById('loginBtn').onclick = function() {
  var login = document.getElementById('loginInput').value.trim();
  var pass = document.getElementById('loginPass').value;
  if (login === userAccount.login && pass === userAccount.pass) {
    document.getElementById('loginScreen').classList.add('hidden');
    bootOS();
  } else { alert('Неверный логин или пароль!'); }
};

function bootOS() {
  document.querySelectorAll('.win').forEach(function(w) { w.remove(); });
  openWindows = {};
  applyConfig();
  renderDesktop();
}

function applyConfig() {
  document.documentElement.setAttribute('data-theme', config.theme);
  document.getElementById('desktop').style.filter = 'brightness(' + config.bright + '%)';
  document.getElementById('trayLang').textContent = config.lang.toUpperCase();
  document.getElementById('trayVolume').textContent = config.vol === 0 ? '🔇' : '🔊';
  document.getElementById('trayWifi').textContent = config.wifi ? '📶' : '📵';
  document.getElementById('trayTheme').textContent = config.theme === 'dark' ? '🌙' : '☀️';
  document.getElementById('startUserName').textContent = config.userName;
  document.getElementById('startAvatar').textContent = config.userAvatar;
  renderDesktop();
  if (document.getElementById('startMenu').classList.contains('open')) buildStartMenu();
}

// ================= РАБОЧИЙ СТОЛ =================
function renderDesktop() {
  var desk = document.getElementById('desktop');
  document.querySelectorAll('.desktop-icon').forEach(function(e) { e.remove(); });
  
  var icons = SYSTEM_ICONS.concat(getDesktopFiles().map(function(f) {
    return { id: 'desk:' + f.id, label: f.name, glyph: f.type === 'dir' ? '📁' : '📄', app: f.type === 'dir' ? 'explorer' : 'notepad', path: f.path, deskFile: f };
  }));

  icons.forEach(function(ic, idx) {
    var el = document.createElement('div');
    el.className = 'desktop-icon';
    el.dataset.id = ic.id;
    el.style.left = '10px';
    el.style.top = (10 + idx * 95) + 'px';
    el.innerHTML = '<span class="glyph">' + ic.glyph + '</span>' + ic.label;
    
    el.onclick = function(e) {
      e.stopPropagation();
      document.querySelectorAll('.desktop-icon').forEach(function(i) { i.classList.remove('selected'); });
      el.classList.add('selected');
      selectedIcons = [el];
    };
    el.ondblclick = function() {
      if (ic.deskFile) {
        if (ic.deskFile.type === 'dir') launchApp('explorer', ic.deskFile.path);
        else launchApp('notepad', ic.deskFile.path);
      } else {
        launchApp(ic.app, ic.path);
      }
    };
    
    el.oncontextmenu = function(e) {
      e.preventDefault();
      e.stopPropagation();
      var isVirtual = !!ic.deskFile;
      var items = [
        { icon: '📂', label: 'Открыть', action: function() { el.ondblclick(); } },
        '-'
      ];
      if (isVirtual) {
        items.push({ icon: '📋', label: 'Копировать', action: function() {
          clipboard = { path: ic.deskFile.path, type: 'copy', source: 'desktop' };
        }});
        items.push({ icon: '✂️', label: 'Вырезать', action: function() {
          clipboard = { path: ic.deskFile.path, type: 'cut', source: 'desktop' };
        }});
        items.push({ icon: '🗑️', label: 'Удалить', action: function() {
          if (!confirm('Удалить «' + ic.label + '»?')) return;
          var arr = getDesktopFiles().filter(function(f) { return f.id !== ic.deskFile.id; });
          saveDesktopFiles(arr);
          renderDesktop();
        }});
        items.push('-');
        items.push({ icon: '✏️', label: 'Переименовать', action: function() {
          var nn = prompt('Новое имя:', ic.label);
          if (!nn) return;
          var arr = getDesktopFiles().map(function(f) {
            if (f.id === ic.deskFile.id) f.name = nn;
            return f;
          });
          saveDesktopFiles(arr);
          renderDesktop();
        }});
      } else {
        items.push({ icon: '📋', label: 'Копировать', disabled: true });
        items.push({ icon: '✂️', label: 'Вырезать', disabled: true });
        items.push({ icon: '🗑️', label: 'Удалить', disabled: true });
      }
      items.push('-');
      items.push({ icon: '📋', label: 'Вставить', disabled: !clipboard, action: async function() {
        await pasteToDesktop();
        renderDesktop();
      }});
      items.push({ icon: '🔄', label: 'Обновить', action: function() { renderDesktop(); } });
      
      showCtxMenu(e.clientX, e.clientY, items);
    };
    
    var isDragging = false, startX = 0, startY = 0, origX = 0, origY = 0;
    el.onmousedown = function(e) {
      if (e.button !== 0) return;
      isDragging = false;
      startX = e.clientX; startY = e.clientY;
      origX = parseInt(el.style.left); origY = parseInt(el.style.top);
      
      function move(ev) {
        if (Math.abs(ev.clientX - startX) > 5 || Math.abs(ev.clientY - startY) > 5) {
          isDragging = true;
          el.style.left = (origX + ev.clientX - startX) + 'px';
          el.style.top = (origY + ev.clientY - startY) + 'px';
        }
      }
      function up() {
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
      }
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    };

    desk.appendChild(el);
  });
}

async function pasteToDesktop() {
  if (!clipboard) return;
  var arr = getDesktopFiles();
  var name = clipboard.path.split('/').pop() || 'file';
  var newName = name;
  var i = 1;
  while (arr.some(function(f) { return f.name === newName; })) {
    newName = name.replace(/(\.[^.]+)?$/, '_' + i + '$1');
    i++;
  }

  if (clipboard.source === 'desktop') {
    // Копирование/вырезание между десктопом
    var src = arr.find(function(f) { return f.path === clipboard.path; });
    if (!src) return;
    if (clipboard.type === 'copy') {
      arr.push({ id: Date.now() + '_' + Math.random().toString(36).slice(2), name: newName, type: src.type, path: src.path });
    } else {
      src.name = newName;
    }
  } else {
    // Из файловой системы → на десктоп (виртуальная ссылка)
    var isDir = !name.includes('.');
    arr.push({ id: Date.now() + '_' + Math.random().toString(36).slice(2), name: newName, type: isDir ? 'dir' : 'file', path: clipboard.path });
    if (clipboard.type === 'cut') {
      // физическое удаление не делаем — оставляем оригинал, но сбрасываем clipboard
    }
  }
  saveDesktopFiles(arr);
  clipboard = null;
}

var selBox = document.getElementById('selection-box');
var isSelecting = false, selStartX = 0, selStartY = 0;
document.getElementById('desktop').addEventListener('mousedown', function(e) {
  if (e.target.id !== 'desktop') return;
  isSelecting = true;
  selStartX = e.clientX; selStartY = e.clientY;
  selBox.style.left = e.clientX + 'px';
  selBox.style.top = e.clientY + 'px';
  selBox.style.width = '0px';
  selBox.style.height = '0px';
  selBox.style.display = 'block';
  selectedIcons = [];
  document.querySelectorAll('.desktop-icon').forEach(function(i) { i.classList.remove('selected'); });
});
document.addEventListener('mousemove', function(e) {
  if (!isSelecting) return;
  var w = e.clientX - selStartX;
  var h = e.clientY - selStartY;
  selBox.style.left = (w < 0 ? e.clientX : selStartX) + 'px';
  selBox.style.top = (h < 0 ? e.clientY : selStartY) + 'px';
  selBox.style.width = Math.abs(w) + 'px';
  selBox.style.height = Math.abs(h) + 'px';
});
document.addEventListener('mouseup', function() {
  if (!isSelecting) return;
  isSelecting = false;
  selBox.style.display = 'none';
  var rect = { left: parseInt(selBox.style.left), top: parseInt(selBox.style.top), right: parseInt(selBox.style.left) + parseInt(selBox.style.width), bottom: parseInt(selBox.style.top) + parseInt(selBox.style.height) };
  document.querySelectorAll('.desktop-icon').forEach(function(icon) {
    var ir = icon.getBoundingClientRect();
    if (ir.left < rect.right && ir.right > rect.left && ir.top < rect.bottom && ir.bottom > rect.top) {
      icon.classList.add('selected');
      selectedIcons.push(icon);
    }
  });
});

// Горячие клавиши для рабочего стола
document.addEventListener('keydown', function(e) {
  var active = document.activeElement;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;

  if (e.key === 'Delete' && selectedIcons.length) {
    var ids = selectedIcons.map(function(el) { return el.dataset.id; });
    var arr = getDesktopFiles().filter(function(f) { return ids.indexOf('desk:' + f.id) === -1; });
    saveDesktopFiles(arr);
    selectedIcons = [];
    renderDesktop();
  }
  if (e.ctrlKey && e.key.toLowerCase() === 'c' && selectedIcons.length === 1) {
    var f = getDesktopFiles().find(function(x) { return 'desk:' + x.id === selectedIcons[0].dataset.id; });
    if (f) clipboard = { path: f.path, type: 'copy', source: 'desktop' };
  }
  if (e.ctrlKey && e.key.toLowerCase() === 'x' && selectedIcons.length === 1) {
    var f2 = getDesktopFiles().find(function(x) { return 'desk:' + x.id === selectedIcons[0].dataset.id; });
    if (f2) clipboard = { path: f2.path, type: 'cut', source: 'desktop' };
  }
  if (e.ctrlKey && e.key.toLowerCase() === 'v') {
    pasteToDesktop().then(function() { renderDesktop(); });
  }
});

// ================= ОКНА =================
function createWindow(opts) {
  var id = 'win' + (winIdSeq++);
  var el = document.createElement('div');
  el.className = 'win';
  el.id = id;
  el.style.width = (opts.width || 400) + 'px';
  el.style.height = (opts.height || 450) + 'px';
  el.style.left = (40 + (winIdSeq % 5) * 20) + 'px';
  el.style.top = (40 + (winIdSeq % 5) * 20) + 'px';
  el.style.zIndex = ++winZ;
  
  el.innerHTML = '<div class="titlebar">' +
      '<span>' + (opts.glyph || '📄') + '</span>' +
      '<span class="title">' + (opts.title || 'Окно') + '</span>' +
      '<button class="btn min">_</button>' +
      '<button class="btn max">□</button>' +
      '<button class="btn close">✕</button>' +
    '</div>' +
    '<div class="content"></div>';
  document.body.appendChild(el);
  
  var content = el.querySelector('.content');
  if (opts.contentHTML) content.innerHTML = opts.contentHTML;

  var winObj = { id: id, el: el, title: opts.title, glyph: opts.glyph, minimized: false };
  openWindows[id] = winObj;

  el.querySelector('.close').onclick = function() { el.remove(); delete openWindows[id]; renderTaskbar(); };
  el.querySelector('.min').onclick = function() { winObj.minimized = true; el.style.display = 'none'; renderTaskbar(); };
  el.querySelector('.max').onclick = function() { el.classList.toggle('maximized'); };
  
  var tb = el.querySelector('.titlebar');
  var dragging = false, dx = 0, dy = 0;
  tb.onmousedown = function(e) {
    if (e.target.tagName === 'BUTTON') return;
    dragging = true;
    dx = e.clientX - el.offsetLeft;
    dy = e.clientY - el.offsetTop;
    focusWindow(id);
  };
  window.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    el.style.left = Math.max(0, e.clientX - dx) + 'px';
    el.style.top = Math.max(0, e.clientY - dy) + 'px';
  });
  window.addEventListener('mouseup', function() { dragging = false; });

  el.addEventListener('mousedown', function() { focusWindow(id); });

  focusWindow(id);
  if (opts.onMount) opts.onMount(content, el);
  return el;
}

function focusWindow(id) {
  var w = openWindows[id];
  if (!w) return;
  w.el.style.zIndex = ++winZ;
  if (w.minimized) { w.minimized = false; w.el.style.display = 'flex'; }
  renderTaskbar();
}

function renderTaskbar() {
  var box = document.getElementById('taskItems');
  box.innerHTML = '';
  for (var id in openWindows) {
    var w = openWindows[id];
    var item = document.createElement('div');
    item.className = 'taskItem' + (!w.minimized ? ' active' : '');
    item.textContent = w.glyph + ' ' + w.title;
    item.onclick = (function(wid, win) {
      return function() {
        if (win.minimized) focusWindow(wid);
        else { win.minimized = true; win.el.style.display = 'none'; renderTaskbar(); }
      };
    })(id, w);
    box.appendChild(item);
  }
}

// ================= КОНТЕКСТНОЕ МЕНЮ =================
function showCtxMenu(x, y, items) {
  var old = document.querySelector('.ctxMenu');
  if (old) old.remove();

  var menu = document.createElement('div');
  menu.className = 'ctxMenu';
  menu.innerHTML = items.map(function(it, i) {
    if (it === '-') return '<div class="sep"></div>';
    return '<div class="item ' + (it.disabled ? 'disabled' : '') + '" data-i="' + i + '"><span>' + (it.icon || '') + '</span>' + it.label + '</div>';
  }).join('');
  document.body.appendChild(menu);
  
  var w = menu.offsetWidth, h = menu.offsetHeight;
  menu.style.left = Math.min(x, window.innerWidth - w - 10) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - h - 10) + 'px';

  menu.querySelectorAll('.item').forEach(function(el) {
    el.onclick = function(e) { 
      e.stopPropagation(); 
      menu.remove(); 
      if (items[+el.dataset.i] && items[+el.dataset.i].action) items[+el.dataset.i].action();
    };
  });
  
  setTimeout(function() {
    document.addEventListener('mousedown', function close(e) {
      if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('mousedown', close); }
    });
  }, 100);
}

// ================= ПРИЛОЖЕНИЯ =================
function launchApp(app, path) {
  if (app === 'explorer') openExplorer(path);
  else if (app === 'notepad') openNotepad(path);
  else if (app === 'settings') openSettings();
  else if (app === 'console') openConsole();
  else if (app === 'browser') openBrowser();
}

// -------- Проводник --------
function openExplorer(path) {
  path = path || '/';
  createWindow({
    title: 'Проводник', glyph: '📁', width: 450, height: 500,
    onMount: function(content, el) {
      var current = path;
      
      async function render() {
        el.querySelector('.title').textContent = '📁 ' + current;
        content.innerHTML = '<div class="pathBar"><span>' + current + '</span>' + (current !== '/' ? '<button id="upBtn">⬆</button>' : '') + '</div>';
        
        var actions = document.createElement('div');
        actions.style.display = 'flex'; actions.style.gap = '5px'; actions.style.marginBottom = '10px';
        actions.innerHTML = '<button id="newFolderBtn" style="flex:1; padding:5px; cursor:pointer;">+ Папка</button><button id="newFileBtn" style="flex:1; padding:5px; cursor:pointer;">+ Файл</button><button id="importBtn" style="flex:1; padding:5px; cursor:pointer;">📥 Импорт</button><button id="pasteBtn" style="flex:1; padding:5px; cursor:pointer;" ' + (clipboard ? '' : 'disabled') + '>📋 Вставить</button>';
        content.appendChild(actions);
        
        var grid = document.createElement('div');
        grid.className = 'fileGrid';
        content.appendChild(grid);

        grid.oncontextmenu = function(e) {
          e.preventDefault();
          if (e.target !== grid) return;
          
          showCtxMenu(e.clientX, e.clientY, [
            { icon: '📁', label: 'Создать папку', action: async function() {
                var name = prompt('Имя папки:');
                if (name) { await OS_API.mkdir(current, name); render(); }
              }
            },
            { icon: '📄', label: 'Создать файл', action: async function() {
                var name = prompt('Имя файла:', 'file.txt');
                if (name) { await OS_API.touch(current, name); render(); }
              }
            },
            '-',
            { icon: '📋', label: 'Вставить', disabled: !clipboard, action: async function() {
                if (clipboard) {
                  var newP = (current === '/' ? '' : current) + '/' + clipboard.path.split('/').pop();
                  if (clipboard.source === 'desktop') {
                    // вставка с рабочего стола в файловую систему
                    var data = ''; // нет содержимого
                    await OS_API.write(newP, data);
                  } else {
                    await OS_API.exec('cp -r "' + clipboard.path + '" "' + newP + '"');
                    if (clipboard.type === 'cut') await OS_API.rm(clipboard.path);
                  }
                  clipboard = null;
                  render();
                }
              }
            },
            { icon: '🔄', label: 'Обновить', action: function() { render(); } }
          ]);
        };

        var files = await OS_API.ls(current);
        
        files.forEach(function(f) {
          var item = document.createElement('div');
          item.className = 'fileItem';
          var g = f.type === 'dir' ? '📁' : '📄';
          item.innerHTML = '<span class="g">' + g + '</span>' + f.name;
          
          item.onclick = function() {
            grid.querySelectorAll('.fileItem').forEach(function(fi) { fi.classList.remove('selected'); });
            item.classList.add('selected');
          };
          item.ondblclick = function() {
            var p = (current === '/' ? '' : current) + '/' + f.name;
            if (f.type === 'dir') { current = p; render(); }
            else openNotepad(p);
          };
          
          item.oncontextmenu = function(e) {
            e.preventDefault();
            e.stopPropagation();
            var filePath = (current === '/' ? '' : current) + '/' + f.name;
            
            showCtxMenu(e.clientX, e.clientY, [
              { icon: '📂', label: 'Открыть', action: item.ondblclick },
              '-',
              { icon: '📋', label: 'Копировать', action: function() { clipboard = { path: filePath, type: 'copy', source: 'fs' }; } },
              { icon: '✂️', label: 'Вырезать', action: function() { clipboard = { path: filePath, type: 'cut', source: 'fs' }; } },
              { icon: '📥', label: 'Вставить', disabled: !clipboard || f.type !== 'dir', action: async function() {
                  if (clipboard) {
                    var newP = filePath + '/' + clipboard.path.split('/').pop();
                    if (clipboard.source === 'desktop') {
                      await OS_API.write(newP, '');
                    } else {
                      await OS_API.exec('cp -r "' + clipboard.path + '" "' + newP + '"');
                      if (clipboard.type === 'cut') await OS_API.rm(clipboard.path);
                    }
                    clipboard = null;
                    render();
                  }
                }
              },
              '-',
              { icon: '🗑️', label: 'Удалить', action: async function() {
                  if (confirm('Удалить ' + f.name + '?')) {
                    await OS_API.rm(filePath);
                    render();
                  }
                }
              },
              '-',
              { icon: '📌', label: 'Создать ярлык на рабочем столе', action: function() {
                  var arr = getDesktopFiles();
                  arr.push({ id: Date.now() + '_' + Math.random().toString(36).slice(2), name: f.name, type: f.type, path: filePath });
                  saveDesktopFiles(arr);
                  renderDesktop();
                }
              }
            ]);
          };
          grid.appendChild(item);
        });

        if (current !== '/') {
          var upBtn = content.querySelector('#upBtn');
          if (upBtn) upBtn.onclick = function() {
            var idx = current.lastIndexOf('/');
            current = idx <= 0 ? '/' : current.substring(0, idx);
            render();
          };
        }

        content.querySelector('#newFolderBtn').onclick = async function() {
          var name = prompt('Имя папки:');
          if (name) { await OS_API.mkdir(current, name); render(); }
        };
        content.querySelector('#newFileBtn').onclick = async function() {
          var name = prompt('Имя файла:', 'file.txt');
          if (name) { await OS_API.touch(current, name); render(); }
        };
        content.querySelector('#importBtn').onclick = function() {
          var input = document.createElement('input');
          input.type = 'file';
          input.onchange = function() {
            var file = input.files[0];
            var reader = new FileReader();
            reader.onload = async function(ev) {
              await OS_API.write((current === '/' ? '' : current) + '/' + file.name, ev.target.result);
              render();
            };
            reader.readAsText(file);
          };
          input.click();
        };
        content.querySelector('#pasteBtn').onclick = async function() {
          if (!clipboard) return;
          var newP = (current === '/' ? '' : current) + '/' + clipboard.path.split('/').pop();
          if (clipboard.source === 'desktop') {
            await OS_API.write(newP, '');
          } else {
            await OS_API.exec('cp -r "' + clipboard.path + '" "' + newP + '"');
            if (clipboard.type === 'cut') await OS_API.rm(clipboard.path);
          }
          clipboard = null;
          render();
        };
      }
      render();
    }
  });
}

function openNotepad(filePath) {

          path = name;

      };
    }
  });
}

// -------- Браузер --------
function openBrowser() {
  createWindow({
    title: 'Браузер', glyph: '🌐', width: 800, height: 600,
    onMount: function(content, el) {
      el.classList.add('maximized');
      content.style.padding = '0';
      content.innerHTML =
        '<div class="browser-toolbar">' +
          '<button id="bBack">◀</button>' +
          '<button id="bFwd">▶</button>' +
          '<button id="bReload">⟳</button>' +
          '<button id="bHome">🏠</button>' +
          '<input type="text" id="bUrl" value="https://example.com" placeholder="Введите адрес...">' +
          '<button id="bGo">Перейти</button>' +
          '<button id="bExternal" title="Открыть в новой вкладке">↗</button>' +
        '</div>' +
        '<iframe class="browser-frame" id="bFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>';

      var history = ['https://example.com'];
      var hidx = 0;
      var frame = content.querySelector('#bFrame');
      var urlInput = content.querySelector('#bUrl');

      function load(url) {
        var full = url;
        if (!/^https?:\/\//i.test(full)) full = 'https://' + full;
        urlInput.value = full;
        try { frame.src = full; } catch(e) {}
      }

      function pushHistory(url) {
        if (url === history[hidx]) return;
        history = history.slice(0, hidx + 1);
        history.push(url);
        hidx = history.length - 1;
      }

      content.querySelector('#bGo').onclick = function() {
        var u = urlInput.value.trim();
        if (!u) return;
        load(u);
        pushHistory(u);
      };
      urlInput.onkeydown = function(e) {
        if (e.key === 'Enter') content.querySelector('#bGo').click();
      };
      content.querySelector('#bBack').onclick = function() {
        if (hidx > 0) { hidx--; load(history[hidx]); }
      };
      content.querySelector('#bFwd').onclick = function() {
        if (hidx < history.length - 1) { hidx++; load(history[hidx]); }
      };
      content.querySelector('#bReload').onclick = function() { load(urlInput.value); };
      content.querySelector('#bHome').onclick = function() { load('https://example.com'); pushHistory('https://example.com'); };
      content.querySelector('#bExternal').onclick = function() {
        window.open(urlInput.value || 'https://example.com', '_blank');
      };
    }
  });
}

            '<div class="settings-row"><label>Имя сети</label><input type="text" value="XPWeb-Net" disabled></div>' +
            '<div class="settings-row"><label>IP-адрес</label><input type="text" value="192.168.1.42" disabled></div>';
          main.querySelector('#sWifi').onchange = function(e) { config.wifi = e.target.checked; applyConfig(); };
        }
        if (sec === 'account') {
          main.innerHTML = '<h3>Аккаунт</h3>' +
            '<div class="settings-row"><label>Имя</label><input type="text" id="sName" value="' + config.userName + '"></div>' +
            '<div class="settings-row"><label>Аватар</label><select id="sAvatar">' +
            ['👤', '👨‍💻', '🐱', '🤖'].map(function(a) { return '<option value="' + a + '" ' + (config.userAvatar === a ? 'selected' : '') + '>' + a + '</option>'; }).join('') +
            '</select></div>' +
            '<div class="settings-row"><button id="sSaveAcc" style="padding:8px 16px; cursor:pointer;">Сохранить</button></div>';
          main.querySelector('#sSaveAcc').onclick = function() {
            config.userName = main.querySelector('#sName').value.trim() || 'Пользователь';
            config.userAvatar = main.querySelector('#sAvatar').value;
            if (userAccount) {
              userAccount.name = config.userName;
              userAccount.avatar = config.userAvatar;
              localStorage.setItem(USER_KEY, JSON.stringify(userAccount));
            }
            applyConfig();
            alert('Сохранено');
          };
        }
        if (sec === 'system') {
          main.innerHTML = '<h3>Система</h3><div id="sysInfo">Загрузка...</div>' +
            '<div class="settings-row"><label><input type="checkbox" id="sUpd" ' + (config.updateAuto ? 'checked' : '') + '> Автообновление</label></div>' +
            '<div class="settings-row"><label><input type="checkbox" id="sBatt" ' + (config.batterySaver ? 'checked' : '') + '> Энергосбережение</label></div>';
          OS_API.exec('uname -a && free -m').then(function(info) {
            var el = main.querySelector('#sysInfo');
            if (el) el.innerHTML = '<pre style="background:#000; color:#0f0; padding:10px; font-size:12px;">' + info + '</pre>';
          });
          main.querySelector('#sUpd').onchange = function(e) { config.updateAuto = e.target.checked; };
          main.querySelector('#sBatt').onchange = function(e) { config.batterySaver = e.target.checked; };
        }
        if (sec === 'security') {
          main.innerHTML = '<h3>Безопасность</h3>' +
            '<div class="settings-row"><label><input type="checkbox" id="sFw" ' + (config.firewall ? 'checked' : '') + '> Брандмауэр</label></div>' +
            '<div class="settings-row"><label>Сменить пароль</label><input type="password" id="sOldPass" placeholder="Текущий пароль">' +
            '<input type="password" id="sNewPass" placeholder="Новый пароль" style="margin-top:6px;">' +
            '<button id="sChPass" style="margin-top:8px; padding:8px 16px; cursor:pointer;">Сменить</button></div>';
          main.querySelector('#sFw').onchange = function(e) { config.firewall = e.target.checked; };
          main.querySelector('#sChPass').onclick = function() {
            var oldP = main.querySelector('#sOldPass').value;
            var newP = main.querySelector('#sNewPass').value;
            if (!userAccount) return;
            if (oldP !== userAccount.pass) { alert('Неверный текущий пароль'); return; }
            if (!newP) { alert('Введите новый пароль'); return; }
            userAccount.pass = newP;
            localStorage.setItem(USER_KEY, JSON.stringify(userAccount));
            alert('Пароль изменён');
            main.querySelector('#sOldPass').value = '';
            main.querySelector('#sNewPass').value = '';
          };
        }
        if (sec === 'reset') {
          main.innerHTML = '<h3>Сброс</h3>' +
            '<div class="settings-row"><button id="sResetDesk" style="padding:8px 16px; cursor:pointer;">Очистить рабочий стол</button></div>' +
            '<div class="settings-row"><button id="sResetAll" style="padding:8px 16px; cursor:pointer; background:#c33; color:#fff; border:none; border-radius:3px;">Полный сброс системы</button></div>';
          main.querySelector('#sResetDesk').onclick = function() {
            if (!confirm('Удалить все ярлыки с рабочего стола?')) return;
            saveDesktopFiles([]);
            renderDesktop();
          };
          main.querySelector('#sResetAll').onclick = function() {
            if (!confirm('Полный сброс удалит аккаунт и все данные. Продолжить?')) return;
            localStorage.removeItem(USER_KEY);
            localStorage.removeItem(DESKTOP_FILES_KEY);
            location.reload();
          };
        }
      }

      sidebar.querySelector('.item').classList.add('active');
      renderSection('lang');
    }
  });
}

// Применение обоев
function applyWallpaper() {
  var map = {
    default: 'linear-gradient(180deg, #3a6ea5 0%, #24557f 100%)',
    green: 'linear-gradient(180deg, #5a9e3a 0%, #2d5e1a 100%)',
    dark: 'linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%)',
    purple: 'linear-gradient(180deg, #6a3a9e 0%, #2d1a5e 100%)'
  };
  var v = map[config.wallpaper] || map.default;
  document.getElementById('desktop').style.background = v;
  document.documentElement.style.setProperty('--bg-desktop', v);
}

// Меню Пуск
var startMenu = document.getElementById('startMenu');
var startBody = document.getElementById('startBody');

function buildStartMenu() {
  startBody.innerHTML = '<div class="startItem" data-app="explorer" data-path="/"><span class="g">💽</span>Корень</div>' +
    '<div class="startItem" data-app="explorer" data-path="/data"><span class="g">📁</span>Данные</div>' +
    '<div class="startItem" data-app="console"><span class="g">💻</span>Терминал</div>' +
    '<div class="startItem" data-app="browser"><span class="g">🌐</span>Браузер</div>' +
    '<div class="startItem" data-app="settings"><span class="g">⚙️</span>Настройки</div>';
  startBody.querySelectorAll('.startItem').forEach(function(el) {
    el.onclick = function() { launchApp(el.dataset.app, el.dataset.path); startMenu.classList.remove('open'); };
  });
}

document.getElementById('startBtn').onclick = function(e) {
  e.stopPropagation();
  startMenu.classList.toggle('open');
  if (startMenu.classList.contains('open')) buildStartMenu();
};

document.addEventListener('click', function(e) {
  if (!startMenu.contains(e.target) && e.target.id !== 'startBtn') startMenu.classList.remove('open');
});

document.getElementById('trayTheme').onclick = function() { config.theme = config.theme === 'light' ? 'dark' : 'light'; applyConfig(); };
document.getElementById('trayVolume').onclick = function() { config.vol = config.vol === 0 ? 80 : 0; applyConfig(); };
document.getElementById('trayWifi').onclick = function() { config.wifi = !config.wifi; applyConfig(); };

document.getElementById('btnShutdown').onclick = function() {
  document.body.innerHTML = '<div style="color:white; background:black; width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:24px;">Завершение работы...</div>';
  setTimeout(function() { location.reload(); }, 2000);
};

checkAuth();
applyWallpaper();
</script>
</body>
